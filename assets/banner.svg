<svg width="1200" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">
  <defs>
    <style>
      @keyframes blink   { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes sweep   { 0%{transform:translateY(-6px)} 100%{transform:translateY(346px)} }
      @keyframes tape    { 0%{transform:translateX(0)} 100%{transform:translateX(-1200px)} }
      @keyframes p-cyan  { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes p-green { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes p-pink  { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes fade-g  { 0%,100%{opacity:.8} 50%{opacity:1} }
      .cursor   { animation: blink   1.1s step-end    infinite; }
      .scanline { animation: sweep   6s   linear      infinite; }
      .tape-txt { animation: tape    22s  linear      infinite; }
      .dot-c    { animation: p-cyan  2s   ease-in-out infinite; }
      .dot-g    { animation: p-green 2s   ease-in-out infinite .45s; }
      .dot-p    { animation: p-pink  2s   ease-in-out infinite .9s; }
      .glow-g   { animation: fade-g  3s   ease-in-out infinite; }
    </style>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="#161b22" stroke-width=".8"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Scan line -->
  <rect class="scanline" x="0" y="0" width="1200" height="2" fill="white" opacity=".025"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#010409"/>
  <rect x="0" y="33" width="1200" height="1" fill="#21262d"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>

  <!-- Top bar labels -->
  <text x="74" y="22" fill="#e6842a" font-family="Courier New,Courier,monospace" font-size="11" font-weight="bold" letter-spacing="2">GITRADE EXCHANGE</text>
  <text x="234" y="22" fill="#2d333b" font-family="Courier New,Courier,monospace" font-size="11">|  v3.0-arena</text>
  <text x="1182" y="22" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="11" text-anchor="end">SETTLEMENT: SUNDAY 00:00 UTC</text>

  <!-- GITRADE title -->
  <text x="56" y="138" fill="#e6edf3" font-family="Courier New,Courier,monospace" font-size="86" font-weight="bold" letter-spacing="-4">GIT</text>
  <text x="272" y="138" font-family="Courier New,Courier,monospace" font-size="86" font-weight="bold" letter-spacing="-4" fill="#e6842a" class="glow-g">RADE</text>

  <!-- Tagline -->
  <text x="58" y="170" fill="#6e7681" font-family="Courier New,Courier,monospace" font-size="15">A futures market that lives inside this repo.</text>

  <!-- Rule -->
  <rect x="58" y="190" width="530" height="1" fill="#21262d"/>

  <!-- Sub copy -->
  <text x="58" y="210" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="12">GitHub Actions is the exchange.  state.json is the order book.</text>
  <text x="58" y="228" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="12">Price floats all week.  Real stats settle it Sunday midnight.</text>

  <!-- CTAs -->
  <rect x="58"  y="252" width="130" height="28" rx="3" fill="#238636"/>
  <text x="123" y="271" fill="#fff" font-family="Courier New,Courier,monospace" font-size="12" font-weight="bold" text-anchor="middle">OPEN AN ISSUE</text>
  <rect x="198" y="252" width="120" height="28" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="258" y="271" fill="#8b949e" font-family="Courier New,Courier,monospace" font-size="12" text-anchor="middle">SUBMIT A BOT</text>

  <!-- Cursor -->
  <rect x="58" y="300" width="9" height="15" fill="#00e5ff" class="cursor"/>

  <!-- Vertical rule -->
  <rect x="660" y="44" width="1" height="260" fill="#21262d"/>

  <!-- Right: TICKERS label -->
  <text x="686" y="68" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="10" letter-spacing="3">LIVE TICKERS</text>
  <rect x="686" y="75" width="490" height="1" fill="#21262d"/>

  <!-- $STAR -->
  <circle cx="700" cy="108" r="6" fill="#00e5ff" class="dot-c"/>
  <text x="718"  y="113" fill="#8b949e" font-family="Courier New,Courier,monospace" font-size="14" font-weight="bold">$STAR</text>
  <text x="820"  y="113" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="10">STARGAZERS</text>
  <polyline points="960,118 974,111 988,115 1002,107 1016,112 1030,104 1044,108 1058,100" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity=".7"/>
  <text x="1155" y="116" fill="#00e5ff" font-family="Courier New,Courier,monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="127" width="490" height="1" fill="#161b22"/>

  <!-- $COMMIT -->
  <circle cx="700" cy="157" r="6" fill="#76ff03" class="dot-g"/>
  <text x="718"  y="162" fill="#8b949e" font-family="Courier New,Courier,monospace" font-size="14" font-weight="bold">$COMMIT</text>
  <text x="836"  y="162" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="10">COMMITS/WK</text>
  <polyline points="960,163 974,157 988,162 1002,154 1016,159 1030,151 1044,156 1058,148" fill="none" stroke="#76ff03" stroke-width="1.5" opacity=".7"/>
  <text x="1155" y="165" fill="#76ff03" font-family="Courier New,Courier,monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="175" width="490" height="1" fill="#161b22"/>

  <!-- $FORK -->
  <circle cx="700" cy="206" r="6" fill="#ff4081" class="dot-p"/>
  <text x="718"  y="211" fill="#8b949e" font-family="Courier New,Courier,monospace" font-size="14" font-weight="bold">$FORK</text>
  <text x="810"  y="211" fill="#3d444d" font-family="Courier New,Courier,monospace" font-size="10">FORKS</text>
  <polyline points="960,211 974,207 988,212 1002,205 1016,210 1030,206 1044,209 1058,204" fill="none" stroke="#ff4081" stroke-width="1.5" opacity=".7"/>
  <text x="1155" y="214" fill="#ff4081" font-family="Courier New,Courier,monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="224" width="490" height="1" fill="#161b22"/>

  <!-- Bot contract panel -->
  <rect x="686" y="238" width="490" height="72" rx="3" fill="#010409" stroke="#21262d" stroke-width="1"/>
  <rect x="686" y="238" width="490" height="20" rx="3" fill="#161b22"/>
  <rect x="686" y="251" width="490" height="7" fill="#161b22"/>
  <text x="931" y="252" fill="#e6842a" font-family="Courier New,Courier,monospace" font-size="10" letter-spacing="2" text-anchor="middle">BOT CONTRACT</text>
  <text x="700" y="272" fill="#4d5566" font-family="Courier New,Courier,monospace" font-size="11">def decide(market: dict) -&gt; list:</text>
  <text x="700" y="289" fill="#4d5566" font-family="Courier New,Courier,monospace" font-size="11">    return [{"ticker":"STAR","side":"BUY",...}]</text>
  <text x="700" y="304" fill="#238636" font-family="Courier New,Courier,monospace" font-size="10"># submit via PR -- runs every 15 min sandboxed</text>

  <!-- Ticker tape bar -->
  <rect x="0" y="315" width="1200" height="25" fill="#010409"/>
  <rect x="0" y="315" width="1200" height="1" fill="#21262d"/>
  <text class="tape-txt" y="332" fill="#2d333b" font-family="Courier New,Courier,monospace" font-size="11" letter-spacing="1" x="0">$STAR --     $COMMIT --     $FORK --     WEEK 1     BUY via ISSUE     SUBMIT A BOT     SETTLE SUNDAY     $STAR --     $COMMIT --     $FORK --     WEEK 1     BUY via ISSUE     SUBMIT A BOT     SETTLE SUNDAY</text>
</svg>

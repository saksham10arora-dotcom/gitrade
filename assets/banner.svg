<svg width="1200" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">
  <defs>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes sweep { 0%{transform:translateY(-340px)} 100%{transform:translateY(340px)} }
      @keyframes pulse-cyan { 0%,100%{opacity:0.7} 50%{opacity:1} }
      @keyframes pulse-green { 0%,100%{opacity:0.7} 50%{opacity:1} }
      @keyframes pulse-pink { 0%,100%{opacity:0.7} 50%{opacity:1} }
      .cursor { animation: blink 1.1s step-end infinite; }
      .scanline { animation: sweep 4s linear infinite; }
      .dot-cyan { animation: pulse-cyan 2s ease-in-out infinite; }
      .dot-green { animation: pulse-green 2s ease-in-out infinite 0.4s; }
      .dot-pink { animation: pulse-pink 2s ease-in-out infinite 0.8s; }
    </style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#161b22" stroke-width="0.8"/>
    </pattern>

    <linearGradient id="fade-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="fade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="main-clip">
      <rect width="1200" height="340"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Scan line -->
  <g clip-path="url(#main-clip)">
    <rect class="scanline" x="0" y="0" width="1200" height="2" fill="white" opacity="0.025"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="36" fill="#010409"/>
  <rect x="0" y="35" width="1200" height="1" fill="#21262d"/>

  <!-- Top bar text -->
  <text x="20" y="23" fill="#e6842a" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold" letter-spacing="2">GITRADE EXCHANGE</text>
  <text x="160" y="23" fill="#21262d" font-family="'Courier New',Courier,monospace" font-size="12">|</text>
  <text x="172" y="23" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11">v3.0-arena</text>

  <text x="1180" y="23" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11" text-anchor="end">SETTLEMENT: SUNDAY 00:00 UTC</text>

  <!-- Left: Main branding -->
  <text x="56" y="136" fill="#e6edf3" font-family="'Courier New',Courier,monospace" font-size="88" font-weight="bold" letter-spacing="-4" opacity="0.95">GIT</text>
  <text x="278" y="136" fill="#e6842a" font-family="'Courier New',Courier,monospace" font-size="88" font-weight="bold" letter-spacing="-4">RADE</text>

  <!-- Tagline -->
  <text x="58" y="172" fill="#6e7681" font-family="'Courier New',Courier,monospace" font-size="16" letter-spacing="0.5">A futures market that lives inside this repo.</text>

  <!-- Divider -->
  <rect x="58" y="192" width="540" height="1" fill="#21262d"/>

  <!-- Sub copy -->
  <text x="58" y="214" fill="#3d444d" font-family="'Courier New',Courier,monospace" font-size="13">No server.  No database.  GitHub Actions is the exchange.</text>
  <text x="58" y="234" fill="#3d444d" font-family="'Courier New',Courier,monospace" font-size="13">state.json is the order book.  Settlement is real GitHub stats.</text>

  <!-- CTA row -->
  <rect x="58" y="264" width="136" height="30" rx="3" fill="#238636" opacity="0.9"/>
  <text x="126" y="284" fill="#ffffff" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold" text-anchor="middle">OPEN AN ISSUE</text>

  <rect x="204" y="264" width="120" height="30" rx="3" fill="#21262d"/>
  <text x="264" y="284" fill="#8b949e" font-family="'Courier New',Courier,monospace" font-size="12" text-anchor="middle">SUBMIT A BOT</text>

  <!-- Blinking cursor -->
  <rect x="58" y="310" width="9" height="16" fill="#00e5ff" opacity="0.9" class="cursor"/>

  <!-- Vertical divider -->
  <rect x="660" y="48" width="1" height="276" fill="#21262d"/>

  <!-- Right: Ticker panel -->
  <text x="688" y="74" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="3">LIVE TICKERS</text>
  <rect x="688" y="82" width="490" height="1" fill="#21262d"/>

  <!-- $STAR row -->
  <circle cx="700" cy="112" r="6" fill="#00e5ff" opacity="0.9" class="dot-cyan"/>
  <text x="718" y="117" fill="#6e7681" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold">$STAR</text>
  <text x="810" y="117" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11">STARGAZERS</text>
  <text x="1148" y="120" fill="#00e5ff" font-family="'Courier New',Courier,monospace" font-size="28" font-weight="bold" text-anchor="end">--</text>
  <rect x="688" y="130" width="490" height="1" fill="#161b22"/>

  <!-- $COMMIT row -->
  <circle cx="700" cy="160" r="6" fill="#76ff03" opacity="0.9" class="dot-green"/>
  <text x="718" y="165" fill="#6e7681" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold">$COMMIT</text>
  <text x="826" y="165" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11">COMMITS / WK</text>
  <text x="1148" y="168" fill="#76ff03" font-family="'Courier New',Courier,monospace" font-size="28" font-weight="bold" text-anchor="end">--</text>
  <rect x="688" y="178" width="490" height="1" fill="#161b22"/>

  <!-- $FORK row -->
  <circle cx="700" cy="208" r="6" fill="#ff4081" opacity="0.9" class="dot-pink"/>
  <text x="718" y="213" fill="#6e7681" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="bold">$FORK</text>
  <text x="810" y="213" fill="#4d5566" font-family="'Courier New',Courier,monospace" font-size="11">FORKS</text>
  <text x="1148" y="216" fill="#ff4081" font-family="'Courier New',Courier,monospace" font-size="28" font-weight="bold" text-anchor="end">--</text>
  <rect x="688" y="226" width="490" height="1" fill="#161b22"/>

  <!-- Bot contract teaser -->
  <rect x="688" y="248" width="490" height="76" rx="4" fill="#010409" stroke="#21262d" stroke-width="1"/>
  <text x="704" y="267" fill="#e6842a" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1">BOT CONTRACT</text>
  <text x="704" y="286" fill="#3d444d" font-family="'Courier New',Courier,monospace" font-size="12">def decide(market: dict) -&gt; list:</text>
  <text x="704" y="302" fill="#3d444d" font-family="'Courier New',Courier,monospace" font-size="12">    return [{"ticker":"STAR","side":"BUY",...}]</text>
  <text x="704" y="316" fill="#238636" font-family="'Courier New',Courier,monospace" font-size="11"># submit via PR. runs every 15 min.</text>

  <!-- Bottom fade -->
  <rect width="1200" height="340" fill="url(#fade-bottom)"/>
</svg>

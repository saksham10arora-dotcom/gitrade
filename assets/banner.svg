<svg width="1200" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340">
  <defs>
    <style>
      @keyframes blink    { 0%,49%{opacity:1}   50%,100%{opacity:0} }
      @keyframes sweep    { 0%{transform:translateY(-340px)} 100%{transform:translateY(340px)} }
      @keyframes ticker   { 0%{transform:translateX(0)}      100%{transform:translateX(-50%)} }
      @keyframes p-cyan   { 0%,100%{opacity:.65;r:6} 50%{opacity:1;r:7.5} }
      @keyframes p-green  { 0%,100%{opacity:.65;r:6} 50%{opacity:1;r:7.5} }
      @keyframes p-pink   { 0%,100%{opacity:.65;r:6} 50%{opacity:1;r:7.5} }
      @keyframes glow-txt { 0%,100%{filter:drop-shadow(0 0 6px #e6842a)} 50%{filter:drop-shadow(0 0 18px #e6842a)} }
      .cursor    { animation: blink   1.1s step-end      infinite; }
      .scanline  { animation: sweep   5s   linear        infinite; }
      .tape      { animation: ticker  18s  linear        infinite; }
      .dot-c     { animation: p-cyan  2s   ease-in-out   infinite; }
      .dot-g     { animation: p-green 2s   ease-in-out   infinite .45s; }
      .dot-p     { animation: p-pink  2s   ease-in-out   infinite .9s; }
      .glow-g    { animation: glow-txt 3s  ease-in-out   infinite; }
    </style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="#161b22" stroke-width=".8"/>
    </pattern>

    <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="75%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip-main"><rect width="1200" height="340"/></clipPath>
    <clipPath id="clip-right"><rect x="662" y="44" width="530" height="284"/></clipPath>
    <clipPath id="clip-tape"><rect x="0" y="316" width="1200" height="24"/></clipPath>
  </defs>

  <!-- Base + grid -->
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- Scanline -->
  <g clip-path="url(#clip-main)">
    <rect class="scanline" x="0" y="0" width="1200" height="3" fill="white" opacity=".02"/>
  </g>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#010409"/>
  <rect x="0" y="33" width="1200" height="1" fill="#21262d"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <text x="74" y="22" fill="#e6842a" font-family="'Courier New',monospace" font-size="11" font-weight="bold" letter-spacing="2">GITRADE EXCHANGE</text>
  <text x="218" y="22" fill="#2d333b" font-family="'Courier New',monospace" font-size="11">|</text>
  <text x="230" y="22" fill="#3d444d" font-family="'Courier New',monospace" font-size="11">v3.0-arena</text>
  <text x="1182" y="22" fill="#3d444d" font-family="'Courier New',monospace" font-size="11" text-anchor="end">SETTLEMENT: SUNDAY 00:00 UTC</text>

  <!-- GITRADE title with orange glow on RADE -->
  <text x="56" y="138" fill="#e6edf3" font-family="'Courier New',monospace" font-size="86" font-weight="bold" letter-spacing="-4">GIT</text>
  <text x="272" y="138" font-family="'Courier New',monospace" font-size="86" font-weight="bold" letter-spacing="-4" fill="#e6842a" class="glow-g">RADE</text>

  <!-- Tagline -->
  <text x="58" y="170" fill="#6e7681" font-family="'Courier New',monospace" font-size="15" letter-spacing=".3">A futures market that lives inside this repo.</text>

  <!-- Thin rule -->
  <rect x="58" y="190" width="530" height="1" fill="#21262d"/>

  <!-- Sub copy -->
  <text x="58" y="210" fill="#3d444d" font-family="'Courier New',monospace" font-size="12">GitHub Actions is the exchange.  state.json is the order book.</text>
  <text x="58" y="228" fill="#3d444d" font-family="'Courier New',monospace" font-size="12">Price floats all week.  Real stats settle it Sunday midnight.</text>

  <!-- CTAs -->
  <rect x="58"  y="252" width="130" height="28" rx="3" fill="#238636" opacity=".9"/>
  <text x="123" y="271" fill="#fff" font-family="'Courier New',monospace" font-size="12" font-weight="bold" text-anchor="middle">OPEN AN ISSUE</text>
  <rect x="198" y="252" width="120" height="28" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="258" y="271" fill="#8b949e" font-family="'Courier New',monospace" font-size="12" text-anchor="middle">SUBMIT A BOT</text>

  <!-- Blink cursor -->
  <rect x="58" y="300" width="9" height="15" fill="#00e5ff" opacity=".9" class="cursor"/>

  <!-- Vertical rule -->
  <rect x="660" y="44" width="1" height="260" fill="#21262d"/>

  <!-- Right panel label -->
  <text x="686" y="68" fill="#3d444d" font-family="'Courier New',monospace" font-size="10" letter-spacing="3">LIVE TICKERS</text>
  <rect x="686" y="75" width="490" height="1" fill="#21262d"/>

  <!-- $STAR row -->
  <circle cx="700" cy="108" r="6" fill="#00e5ff" class="dot-c" filter="url(#glow-cyan)"/>
  <text x="718"  y="113" fill="#8b949e" font-family="'Courier New',monospace" font-size="14" font-weight="bold">$STAR</text>
  <text x="820"  y="113" fill="#3d444d" font-family="'Courier New',monospace" font-size="10">STARGAZERS</text>
  <!-- mini sparkline STAR -->
  <polyline points="970,118 982,112 994,115 1006,108 1018,111 1030,104 1042,107 1054,101"
            fill="none" stroke="#00e5ff" stroke-width="1.5" opacity=".6" filter="url(#glow-cyan)"/>
  <text x="1148" y="116" fill="#00e5ff" font-family="'Courier New',monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="127" width="490" height="1" fill="#161b22"/>

  <!-- $COMMIT row -->
  <circle cx="700" cy="157" r="6" fill="#76ff03" class="dot-g" filter="url(#glow-green)"/>
  <text x="718"  y="162" fill="#8b949e" font-family="'Courier New',monospace" font-size="14" font-weight="bold">$COMMIT</text>
  <text x="836"  y="162" fill="#3d444d" font-family="'Courier New',monospace" font-size="10">COMMITS/WK</text>
  <!-- mini sparkline COMMIT -->
  <polyline points="970,162 982,158 994,163 1006,156 1018,160 1030,153 1042,157 1054,150"
            fill="none" stroke="#76ff03" stroke-width="1.5" opacity=".6" filter="url(#glow-green)"/>
  <text x="1148" y="165" fill="#76ff03" font-family="'Courier New',monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="175" width="490" height="1" fill="#161b22"/>

  <!-- $FORK row -->
  <circle cx="700" cy="206" r="6" fill="#ff4081" class="dot-p" filter="url(#glow-pink)"/>
  <text x="718"  y="211" fill="#8b949e" font-family="'Courier New',monospace" font-size="14" font-weight="bold">$FORK</text>
  <text x="810"  y="211" fill="#3d444d" font-family="'Courier New',monospace" font-size="10">FORKS</text>
  <!-- mini sparkline FORK -->
  <polyline points="970,211 982,208 994,212 1006,206 1018,210 1030,207 1042,209 1054,205"
            fill="none" stroke="#ff4081" stroke-width="1.5" opacity=".6" filter="url(#glow-pink)"/>
  <text x="1148" y="214" fill="#ff4081" font-family="'Courier New',monospace" font-size="26" font-weight="bold" text-anchor="end">--</text>
  <rect x="686" y="224" width="490" height="1" fill="#161b22"/>

  <!-- Bot contract panel -->
  <rect x="686" y="238" width="490" height="72" rx="3" fill="#010409" stroke="#21262d" stroke-width="1"/>
  <rect x="686" y="238" width="490" height="16" rx="3" fill="#161b22"/>
  <rect x="686" y="247" width="490" height="7" fill="#161b22"/>
  <text x="838" y="250" fill="#e6842a" font-family="'Courier New',monospace" font-size="10" letter-spacing="2" text-anchor="middle">BOT CONTRACT</text>
  <text x="700"  y="268" fill="#4d5566" font-family="'Courier New',monospace" font-size="11">def decide(market: dict) -&gt; list:</text>
  <text x="700"  y="284" fill="#4d5566" font-family="'Courier New',monospace" font-size="11">    return [{"ticker":"STAR","side":"BUY",...}]</text>
  <text x="700"  y="300" fill="#238636" font-family="'Courier New',monospace" font-size="10"># submit via PR -- runs every 15 min sandboxed</text>

  <!-- Scrolling ticker tape -->
  <rect x="0" y="315" width="1200" height="25" fill="#010409"/>
  <rect x="0" y="315" width="1200" height="1" fill="#21262d"/>
  <g clip-path="url(#clip-tape)">
    <text class="tape" y="332" fill="#2d333b" font-family="'Courier New',monospace" font-size="11" letter-spacing="1">
      <tspan>$STAR -- &nbsp;&nbsp;&nbsp; $COMMIT -- &nbsp;&nbsp;&nbsp; $FORK -- &nbsp;&nbsp;&nbsp; WEEK 1 &nbsp;&nbsp;&nbsp; BUY via ISSUE &nbsp;&nbsp;&nbsp; SUBMIT A BOT &nbsp;&nbsp;&nbsp; SETTLE SUNDAY &nbsp;&nbsp;&nbsp; $STAR -- &nbsp;&nbsp;&nbsp; $COMMIT -- &nbsp;&nbsp;&nbsp; $FORK -- &nbsp;&nbsp;&nbsp; WEEK 1 &nbsp;&nbsp;&nbsp; BUY via ISSUE &nbsp;&nbsp;&nbsp; SUBMIT A BOT &nbsp;&nbsp;&nbsp; SETTLE SUNDAY &nbsp;&nbsp;&nbsp;</tspan>
    </text>
  </g>

  <!-- Bottom fade -->
  <rect width="1200" height="340" fill="url(#vfade)" opacity=".4"/>
</svg>

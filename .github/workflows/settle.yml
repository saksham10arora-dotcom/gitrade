name: settle

on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market-engine
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install PyGithub matplotlib numpy

      - name: run settlement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python settle.py

      - name: commit state
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add state.json README.md assets/
          git diff --staged --quiet || git commit -m "settle: week closed [skip ci]"
          git pull --rebase origin HEAD
          git push
